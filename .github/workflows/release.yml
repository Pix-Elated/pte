name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (tag: $TAG)"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifacts directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/pte.exe dist/pte.exe

      # ── Build InnoSetup installer ──
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item dist/pte.exe target/release/pte.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.meta.outputs.version }} `
            installer\pte-setup.iss

      # ── Create portable ZIP ──
      - name: Create portable archive
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          Compress-Archive -Path dist\pte.exe, LICENSE, README.md -DestinationPath "dist\pte-${version}-windows-x64-portable.zip"

      # ── Rename artifacts for release ──
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cp dist/pte.exe "dist/pte-${VERSION}-windows-x64.exe"

      # ── VirusTotal scan ──
      - name: Scan with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: cssnr/virustotal-action@v1
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: |
            dist/*.exe
            dist/*.zip
          rate_limit: 4
          sha256: true
          update_release: false
          summary: true

      - name: Save VirusTotal results
        if: steps.virustotal.outcome == 'success'
        shell: pwsh
        run: |
          $vtJson = '${{ steps.virustotal.outputs.json }}'
          if ($vtJson -and $vtJson -ne '') {
            $vtJson | Out-File -FilePath "dist/virustotal-${{ steps.meta.outputs.version }}.json" -Encoding utf8
          }

      # ── Generate checksums ──
      - name: Generate checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $files = @(
            "dist/pte-${version}-windows-x64.exe",
            "dist/pte-${version}-setup.exe",
            "dist/pte-${version}-windows-x64-portable.zip"
          )
          $checksums = @()
          foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path $f -Leaf
              $checksums += "$hash  $name"
            }
          }
          $checksums | Out-File -FilePath "dist/checksums.txt" -Encoding utf8
          Get-Content "dist/checksums.txt"

      # ── Generate version manifest for auto-updater ──
      - name: Generate version manifest
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"

          EXE_HASH=$(grep "windows-x64.exe" dist/checksums.txt | awk '{print $1}' || echo "")
          SETUP_HASH=$(grep "setup.exe" dist/checksums.txt | awk '{print $1}' || echo "")
          ZIP_HASH=$(grep "portable.zip" dist/checksums.txt | awk '{print $1}' || echo "")

          cat > dist/latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "published": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "windows-x64-exe": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/pte-${VERSION}-windows-x64.exe",
                "sha256": "${EXE_HASH}"
              },
              "windows-x64-setup": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/pte-${VERSION}-setup.exe",
                "sha256": "${SETUP_HASH}"
              },
              "windows-x64-portable": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/pte-${VERSION}-windows-x64-portable.zip",
                "sha256": "${ZIP_HASH}"
              }
            }
          }
          EOF
          cat dist/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Parse VirusTotal link
        id: vt
        continue-on-error: true
        shell: bash
        run: |
          VT_FILE=$(ls dist/virustotal-*.json 2>/dev/null | head -1)
          if [ -f "$VT_FILE" ]; then
            VT_LINK=$(jq -r '.[0].link // "N/A"' "$VT_FILE" 2>/dev/null || echo "N/A")
            echo "link=$VT_LINK" >> $GITHUB_OUTPUT
          else
            echo "link=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Build release body
        id: body
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          VT_LINK="${{ steps.vt.outputs.link }}"
          CHECKSUMS=$(cat dist/checksums.txt 2>/dev/null || echo "N/A")

          cat > release-body.md <<BODY
          ## Downloads

          | File | Description |
          |------|-------------|
          | \`pte-${VERSION}-setup.exe\` | **Installer** (recommended) — Start Menu shortcut, .otbm association, uninstaller |
          | \`pte-${VERSION}-windows-x64.exe\` | **Portable executable** — single file, self-updating |
          | \`pte-${VERSION}-windows-x64-portable.zip\` | **Portable archive** — exe + license + readme |

          ## Verification

          Executables are not code-signed. Windows SmartScreen may show a warning on first run.

          <details>
          <summary>SHA-256 Checksums</summary>

          \`\`\`
          ${CHECKSUMS}
          \`\`\`
          </details>

          | VirusTotal | [View Scan](${VT_LINK}) |
          |------------|--------------------------|

          ## Auto-Update

          PTE detects updates automatically on launch.
          - **Installer mode**: downloads and runs the new installer silently
          - **Portable mode**: downloads the new exe and self-replaces
          BODY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: PTE v${{ needs.build.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          append_body: true
          files: |
            dist/pte-*-setup.exe
            dist/pte-*-windows-x64.exe
            dist/pte-*-windows-x64-portable.zip
            dist/checksums.txt
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
