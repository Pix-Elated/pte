[workspace]
resolver = "2"
members = [
    "crates/assets",
    "crates/appearances",
    "crates/otbm",
    "crates/spr_dat",
    "crates/editor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
byteorder = "1"
rand = "0.9"
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
